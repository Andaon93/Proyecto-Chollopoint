version: "3.9"

services:

  # ── PHP + Apache ─────────────────────────────────────────────────────────────
  php:
    build: ./chollopoint-backend
    container_name: chollopoint_php
    ports:
      - "8000:80"
    volumes:
      - ./chollopoint-backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: chollopoint
      DB_USER: chollouser
      DB_PASS: chollopass
    networks:
      - chollonet

  # ── MySQL ─────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: chollopoint_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      chollopoint
      MYSQL_USER:          chollouser
      MYSQL_PASSWORD:      chollopass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
      - ./chollopoint-backend/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uchollouser", "-pchollopass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chollonet

  # ── phpMyAdmin (opcional, para ver la BD visualmente) ────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: chollopoint_pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: chollouser
      PMA_PASSWORD: chollopass
    depends_on:
      - db
    networks:
      - chollonet

volumes:
  db_data:

networks:
  chollonet:
    driver: bridge
